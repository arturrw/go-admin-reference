version: "2"
sql:
  - engine: postgresql
    schema: internal/store/postgres/migrations
    queries: internal/store/postgres/queries
    gen:
      go:
        package: db
        out: internal/store/postgres/db
        sql_package: pgx/v5
        emit_empty_slices: true
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: date
            go_type: time.Time
          # NULL for customers without orders (LEFT JOIN LATERAL in the view).
          - column: customers_v.last_order_at
            go_type:
              import: time
              type: Time
              pointer: true
