# `docker compose up -d --build` starts Postgres and the app (UI + API) on
# http://localhost:8080. For local development run only the database:
# `docker compose up -d postgres`, then the server with
# DATABASE_URL=postgres://goadmin:goadmin@localhost:5433/goadmin?sslmode=disable
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: goadmin
      POSTGRES_PASSWORD: goadmin
      POSTGRES_DB: goadmin
    ports:
      - "5433:5432" # 5433 on the host avoids clashing with a locally installed Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates goadmin_test for `go test` integration tests.
      - ./scripts/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goadmin -d goadmin"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    environment:
      DATABASE_URL: postgres://goadmin:goadmin@postgres:5432/goadmin?sslmode=disable
      SEED: "true"
      # development keeps plain-HTTP cookies and the demo-login buttons; use
      # production only behind HTTPS.
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
