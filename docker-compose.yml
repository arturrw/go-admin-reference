# Local development database. `docker compose up -d` then run the server with
# DATABASE_URL=postgres://goadmin:goadmin@localhost:5433/goadmin?sslmode=disable
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: goadmin
      POSTGRES_PASSWORD: goadmin
      POSTGRES_DB: goadmin
    ports:
      - "5433:5432" # 5433 on the host avoids clashing with a locally installed Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates goadmin_test for `go test` integration tests.
      - ./scripts/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goadmin -d goadmin"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
